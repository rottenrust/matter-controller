<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171820"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Свет">
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><title>Свет · Гостиная</title>
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f6f5fb;background:#13141b;--light:#ffdfa1;--level:.95;--edge:#373842;--muted:#b4b4c0;--accent:#beb5ff}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 15% 0%,#242333 0,transparent 50%),#13141b}main{max-width:1000px;margin:auto;padding:clamp(20px,5vw,62px) clamp(16px,4vw,40px) 60px}header,.line,.heading,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}header{margin-bottom:26px}.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:650}.mark{height:28px;width:28px;border-radius:10px;background:radial-gradient(circle,#f4edff 0 15%,#a69afa 17% 33%,#514876 36% 50%,#2c293b 53%)}#status{color:var(--muted);font-size:14px}.layout{display:grid;grid-template-columns:.92fr 1.08fr;gap:18px;align-items:start}.hero,.card,details{border:1px solid var(--edge);border-radius:22px;background:#1d1e27}.hero{position:relative;overflow:hidden;display:flex;flex-direction:column;isolation:isolate;min-height:420px;padding:28px;background:linear-gradient(155deg,#282732,#1a1b24 70%)}.hero small,.caption{font-size:14px;color:var(--muted)}h1{font-size:clamp(32px,5vw,54px);letter-spacing:-.055em;line-height:1.05;margin:5px 0}h2{font-size:20px;letter-spacing:-.035em;margin:0}p{margin:0}.lamp{position:relative;flex:1;display:grid;place-items:center;min-height:190px}.halo{height:124px;width:124px;border-radius:50%;background:radial-gradient(circle at 40% 33%,#fff 0,var(--light) 60%,#827771 100%);box-shadow:0 0 22px 4px var(--light),0 0 100px 14px var(--light);opacity:var(--level);transition:background .3s,opacity .4s,box-shadow .4s}.off .halo,.unknown .halo{background:radial-gradient(circle at 36% 24%,#555663,#2a2a35 70%);box-shadow:0 6px 24px #1112;opacity:1}.reading{font-size:18px;font-weight:600;display:block;margin:4px 0}.card{padding:24px;display:grid;gap:20px}.panel{display:grid;gap:16px}.rule{border:0;border-top:1px solid var(--edge);margin:0}button,select,input{font:inherit}button,select{color:inherit;background:#2a2b37;border:1px solid #454653;border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:disabled,fieldset:disabled{opacity:.55;cursor:default}fieldset{padding:0;border:0;min-width:0;margin:0;display:contents}.power{width:56px;height:56px;border-radius:50%;font-size:26px;background:#dbd5ff;color:#252037;border:0;line-height:1}.power[aria-pressed=false]{color:#d3d1dd;background:#393943}output{font-variant-numeric:tabular-nums;color:#dfd9ff}.range{width:100%;height:32px;margin:0;accent-color:#c1b7ff;cursor:pointer}.tabs{display:flex;padding:3px;gap:3px;background:#14151c;border-radius:13px}.tabs button{flex:1;border:0;background:transparent;color:var(--muted);min-height:40px;padding:7px}.tabs button[aria-pressed=true]{background:#363541;color:#fff}.swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.swatches button,.picker{width:39px;height:39px;min-height:39px;border-radius:50%;border:3px solid #1d1e27;box-shadow:0 0 0 1px #555463;padding:0;cursor:pointer}.swatches button[aria-pressed=true]{box-shadow:0 0 0 2px #ebe8fc}.picker{position:relative;overflow:hidden;background:conic-gradient(#ee686e,#ffd677,#8adea5,#70c7ef,#b39af5,#ee686e)}.picker input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.picker:focus-within{outline:3px solid var(--accent)}.group{display:grid;gap:12px}.ends{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}[hidden]{display:none!important}.controls{grid-column:1/-1}details{padding:0 22px}summary{padding:18px 0;cursor:pointer;font-weight:600}.settings{border-top:1px solid var(--edge);padding:18px 0;display:grid;gap:17px}.row{flex-wrap:wrap}.row label{color:#d8d8e2}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.msg{margin-top:14px;color:#f2bb98;min-height:1.5em;font-size:15px}#timerLeft{font-size:14px;color:var(--muted)}.foot{font-size:13px;color:var(--muted);margin-top:10px}
.targets{margin-bottom:18px;max-width:480px}.shared{max-width:580px}.results{display:grid;gap:8px;line-height:1.45}.results p{overflow-wrap:anywhere}
@media(max-width:680px){main{padding-top:20px}.layout{grid-template-columns:1fr;gap:12px}header{margin-bottom:16px}.hero{min-height:222px;padding:18px}.lamp{position:absolute;inset:15px 0 0 42%;z-index:-1;min-height:0}.halo{height:83px;width:83px}.hero .line{margin-top:auto}.power{width:47px;height:47px;font-size:23px}.card{padding:18px;gap:15px}.settings{gap:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main><header><div class="brand"><span class="mark" aria-hidden="true"></span>Свет</div><span id="status" role="status">Подключение…</span></header>
<div class="tabs targets" role="group" aria-label="Управлять устройствами"><button data-target="lamp" aria-pressed="true">Лампа</button><button data-target="garland" aria-pressed="false">Гирлянда</button><button data-target="both" aria-pressed="false">Оба</button></div>
<div id="lampView"><div class="layout"><section class="hero unknown" id="hero"><small>Yandex · E27</small><h1>Гостиная</h1><div class="lamp" aria-hidden="true"><div class="halo"></div></div><div class="line"><div><small>Состояние</small><strong class="reading" id="reading">Проверяем…</strong></div><button class="power" id="power" aria-label="Питание лампы" disabled>⏻</button></div></section>
<section class="card"><fieldset id="controls" disabled>
<div class="heading"><h2><label for="level">Яркость</label></h2><output id="levelValue" for="level">—</output></div><input class="range" id="level" type="range" min="1" max="100">
<hr class="rule"><div class="heading"><h2>Оттенок</h2></div><div class="tabs" role="group" aria-label="Выбор палитры"><button id="colorTab" aria-pressed="true">Цвет</button><button id="whiteTab" aria-pressed="false">Белый свет</button></div>
<div id="colors" class="group"><div class="swatches" id="swatches"><label class="picker" title="Выбрать свой цвет"><input type="color" id="custom" aria-label="Выбрать свой цвет"></label></div></div>
<div id="whites" class="group" hidden><div class="heading"><label for="kelvin">Температура</label><output id="kelvinValue" for="kelvin">—</output></div><input class="range" id="kelvin" type="range" min="2700" max="6500" step="50"><div class="ends"><span>Теплее</span><span>Холоднее</span></div></div>
<hr class="rule"><div class="row"><label for="fade">Переход</label><select id="fade"><option value="0">Сразу</option><option value="5">0,5 с</option><option value="20">2 с</option><option value="50">5 с</option><option value="100">10 с</option></select></div>
</fieldset></section>
<details class="controls"><summary>Эффекты и настройки</summary><fieldset id="extra" disabled><div class="settings"><div class="row"><label for="period">Цветовой цикл</label><div class="tools"><select id="period" aria-label="Длина цикла"><option value="10">10 с</option><option value="25" selected>25 с</option><option value="60">1 мин</option><option value="180">3 мин</option></select><select id="direction" aria-label="Направление цикла"><option value="1">Вперёд</option><option value="0">Назад</option></select><button id="loop">Запустить</button></div></div>
<div class="row"><div><label for="minutes">Выключить через</label> <span id="timerLeft"></span></div><div class="tools"><select id="minutes"><option value="5">5 мин</option><option value="15">15 мин</option><option value="30">30 мин</option><option value="60">1 час</option></select><button id="timer">Запустить</button></div></div>
<div class="row"><label for="startup">После отключения электричества</label><select id="startup"><option value="0">Выключить</option><option value="1">Включить</option><option value="2">Сменить состояние</option><option value="null">Как было</option></select></div>
<div class="row"><span>Найти лампу</span><button id="identify">Подать сигнал</button></div></div></fieldset></details></div>
<p id="msg" class="msg" role="status"></p></div>
<section class="card shared" id="sharedView" hidden>
<h1 id="sharedTitle">Гирлянда</h1>
<fieldset id="sharedControls">
<div class="tools"><button id="turnOn">Включить</button><button id="turnOff">Выключить</button></div>
<hr class="rule"><div class="heading"><h2><label for="sharedLevel">Яркость</label></h2><output id="sharedValue" for="sharedLevel">50 %</output></div>
<input class="range" type="range" id="sharedLevel" min="1" max="100" value="50"><button id="applyLevel">Применить яркость</button>
<hr class="rule"><h2>Цвет</h2><div class="swatches" id="sharedSwatches"><label class="picker" title="Выбрать свой цвет"><input type="color" id="sharedColor" aria-label="Выбрать свой цвет"></label></div>
</fieldset><hr class="rule"><div class="results" role="status"><p id="lampResult">Лампа · —</p><p id="garlandResult">Гирлянда · —</p></div>
</section></main><script src="app.js"></script></body></html>
